<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Comm Coach | Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>

  <main class="landing-shell">
    <section class="hero-card">
      <p class="eyebrow">User Profile</p>
      <h1 id="profileName">Session Reports</h1>
      <p class="hero-copy">Your saved reports from previous practice sessions.</p>
      <div class="hero-actions">
        <a href="./coach.html" class="primary landing-link">Back To Coach</a>
        <button class="ghost" id="clearReportsBtn">Clear All Reports</button>
      </div>
    </section>

    <section class="modules-card">
      <p class="section-title">Saved Reports</p>
      <div id="reportHistory" class="history-list"></div>
    </section>
  </main>

  <script type="module" src="./js/profile.js"></script>

</html>
